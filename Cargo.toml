[package]
name = "scrubbed-log-casefile"
version = "0.1.0"
edition = "2024"
description = "Offline, stable-token log redaction and encrypted casefile packaging"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-scrubbed-log-casefile"
readme = "README.md"
keywords = ["logs", "redaction", "privacy", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "casefile"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["aes-crypto", "deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
